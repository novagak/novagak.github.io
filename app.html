<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pictures and things of that nature</title>
    <link rel="stylesheet" href="style.css"> <!-- points to the css file. always make sure that these two files are linked. what is a stylesheet? -->
</head>
<body>
    <div></div> <!-- divs are sections  / dividers on a webpage. they are easily styled by css files (via class and id attributes), and they can serve as containers for other html elements. -->
    <div class="card">
        <h2 class="card-title"> white card with black text </h2> <!-- everything in this div should have the word card before any property. -->
    </div> <!-- what is a class? -->
    <div class="card" id="test"></div>
</body>
</html>
