<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello im noah</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="hero">
        <div class="hero-content">
            <h1 class = "hero-content-text">noah</h1> <!-- only 1 h1 tag per page -->
            <h2 class = "hero-content-text">that is my name</h2>
            <a href="https://www.destinypedia.com/Striker" target="_blank" class="btn">this is the greatest subclass of all time</a>
        </div>
    </section>
     
    <section class="page">
        <div class="page-content">
            <p class="page-content-text">paragraph stand in</p>
            <button>button that does nothing</button>
            <ul class="page-content-text">
                <li>1</li> <!--this line is a child of the ul element-->
                <li>2</li>
                <li>3</li>
            </ul>
            <ol class="page-content-text">
                <li>1</li>
                <li>2</li>
                <li>3</li>
            </ol>               
        </div>
     
    </section>

</body>

</html>

<!-- the blue represents the vertical space any element takes up. the orange represents the vertical space between any two elements. -->
<!-- h1s and h2s can be styled to be the same size. the tag itself is only really important for semantic reasons. -->
